<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Pedido Pizza</h1>
    <form metod="POST" action="teste.jsp">
        Nome: <input type="text" name="nome"> <br>
        Email: <input type="email" name="email"> <br>

        Tmanho: 
        <input type="radio" name="tamanho" value="g" checked> Grande
        <input type="radio" name="tamanho" value="m"> Medio
        <input type="radio" name="tamanho" value="p"> Mequeno
        <br>
        Sabor: <select name="sabor">
            <option>Calabresa</option>
            <option>Napolitana</option>
            <option>Portuguesa</option>
        </select>
        <br>
        Adicionais: <input type="checkbox" name="borda" value="sim"> Borda
        Adicionais: <input type="checkbox" name="queijo" value="sim"> Queijo Extra
        <br>
        Data Entrega: <input type="date" name="dataEntrega">
        <br>
        Comentário:<br>
        <textarea name="mensagem" rows="10" cols="30"></textarea>
        <br>
        <input type="submit">
        
    </form>
</body>
</html>
